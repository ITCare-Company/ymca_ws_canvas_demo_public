ws_camp_header:
  label: 'WS Camp Header'
  category: 'WS Layouts'
  class: '\Drupal\y_camp\Plugin\Layout\WsCampHeaderLayout'
  library: y_camp/header
  template: templates/ws-camp-header
  default_region: header_top_left
  regions:
    header_top_left:
      label: Utility Nav left
    header_top_right:
      label: Utility Nav right
    header_bottom_left:
      label: Main Nav logo
    header_bottom_right:
      label: Main Nav menu
  icon_map:
    - [ header_top_left, header_top_right, header_bottom_left, header_bottom_right]
