      title: 'Youth Soccer'
      body: '<p>Visit the <a href="[site:url]locations">Locations page</a> to find the youth soccer program(s) nearest you.</p><h4>Tab headings should start with H4</h4><p>Cras justo odio, dapibus ac facilisis in, egestas eget quam. Sed posuere consectetur est at lobortis. Nullam id dolor id nibh ultricies vehicula ut id elit. Etiam porta sem malesuada magna mollis euismod. Morbi leo risus, porta ac consectetur ac, vestibulum at eros. Vivamus sagittis lacus vel augue laoreet rutrum faucibus dolor auctor.</p><h4>This is a H4</h4><p>Donec sed odio dui. Vestibulum id ligula porta felis euismod semper. Maecenas faucibus mollis interdum. Aenean lacinia bibendum nulla sed consectetur. Sed posuere consectetur est at lobortis. Morbi leo risus, porta ac consectetur ac, vestibulum at eros. Vivamus sagittis lacus vel augue laoreet rutrum faucibus dolor auctor.</p>'

    -
      id: tab_item_2
      uuid: '1b0cf55e-71ed-4fe7-9cc8-95619a5e88b4'
      title: 'Year-Round'
      body: "<p>Generally, yes! In the spring, we offer outdoor soccer from March–May. In the summer, we offer indoor soccer from June–August. In the fall, we offer outdoor soccer from August–October. In the winter, we offer indoor soccer from January–March.</p>"

    -
      id: tab_item_3
      uuid: '3dbbd214-04bb-423d-b038-19f3586097c9'
      title: 'Practice'
      body: "<p>Teams practice once a week on weeknights for an hour. Most games are played on Saturdays, but there may be a few weeknight games to accommodate holidays, school breaks, and make up games. Players are assigned to teams based on practice availability, requests, skill level and age in order to best balance teams.</p>"

    -
      id: tab_item_4
      uuid: 'cbd9a5ce-70c0-4007-9a5b-896fcb5c652a'
      title: 'Coaching'
      body: "<p>Yes! We can always use more volunteer coaches. It's only a few hours a week, and it makes a big difference in your community and in the lives of many children. <a href='[site:url]demo-volunteer-opportunities'>Find out more about volunteer opportunities here.</a></p>"

