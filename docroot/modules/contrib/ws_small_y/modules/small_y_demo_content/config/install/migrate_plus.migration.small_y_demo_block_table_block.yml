        <h2>h2. Heading</h2>
        <h3>h3. Heading</h3>
        <h4>h4. Heading</h4>
        <h5>h5. Heading</h5>
        <h6>h6. Heading</h6>
        <p>When calling the user to action, use <a href="https://www.w3.org/QA/Tips/noClickHere">brief but meaningful link text</a>.</p>
        <p>You can use the mark tag to <mark>highlight</mark> text.</p>
        <p><del>This line of text is meant to be treated as deleted text.</del></p>
        <p><s>This line of text is meant to be treated as no longer accurate.</s></p>
        <p><ins>This line of text is meant to be treated as an addition to the document.</ins></p>
        <p><u>This line of text will render as underlined</u></p>
        <p><small>This line of text is meant to be treated as fine print.</small></p>
        <p><strong>This line rendered as bold text.</strong></p>
        <p><em>This line rendered as italicized text.</em></p>
        <h3>Button examples</h3>
        <p>In general, buttons follow the guidelines for the <a href="https://getbootstrap.com/docs/4.6/components/buttons/">Bootstrap 4.6 button component</a>. Not all styles may be fully supported.</p>
        <p>Click any button to copy the required classes to your clipboard, then add the classes to the <a href="https://ds-docs.y.org/docs/user-documentation/text-editor/adding-links/#using-button-classes">Advanced link settings</a>.</p>
        <h4>Basic Buttons</h4>
        <p>
            The <code>btn</code> class is required for all buttons, then add a class for the corresponding style. For example, the primary button style uses the classes <code>btn btn-primary</code>.
        </p>
        <p>
            <a type="button" class="btn btn-primary" onclick="copyClass(this)">Primary</a>
            <a type="button" class="btn btn-secondary" onclick="copyClass(this)">Secondary</a>
            <a type="button" class="btn btn-success" onclick="copyClass(this)">Success</a>
            <a type="button" class="btn btn-danger" onclick="copyClass(this)">Danger</a>
            <a type="button" class="btn btn-warning" onclick="copyClass(this)">Warning</a>
            <a type="button" class="btn btn-info" onclick="copyClass(this)">Info</a>
            <a type="button" class="btn btn-light" onclick="copyClass(this)">Light</a>
            <a type="button" class="btn btn-dark" onclick="copyClass(this)">Dark</a>
            <a type="button" class="btn btn-link" onclick="copyClass(this)">Link</a>
        </p>
        <h4>Outline Buttons</h4>
        <p>
            The primary outline button style uses the classes <code>btn btn-outline-primary</code>.
        </p>
        <p>
            <a type="button" class="btn btn-outline-primary" onclick="copyClass(this)">Primary</a>
            <a type="button" class="btn btn-outline-secondary" onclick="copyClass(this)">Secondary</a>
            <a type="button" class="btn btn-outline-success" onclick="copyClass(this)">Success</a>
            <a type="button" class="btn btn-outline-danger" onclick="copyClass(this)">Danger</a>
            <a type="button" class="btn btn-outline-warning" onclick="copyClass(this)">Warning</a>
            <a type="button" class="btn btn-outline-info" onclick="copyClass(this)">Info</a>
            <a type="button" class="btn btn-outline-light" onclick="copyClass(this)">Light</a>
            <a type="button" class="btn btn-outline-dark" onclick="copyClass(this)">Dark</a>
        </p>
        <h4>Button Sizes</h4>
        <p>
            Large and small button styles. Add the <code>btn-lg</code> or <code>btn-sm</code> class to the rest of the classes for large or small buttons, respectively. For example, the primary large button style uses the classes <code>btn btn-primary btn-lg</code>.
        </p>
        <p>
            <a type="button" class="btn btn-primary btn-lg" onclick="copyClass(this)">Large button</a>
            <a type="button" class="btn btn-secondary btn-lg" onclick="copyClass(this)">Large button</a>
            <a type="button" class="btn btn-primary btn-sm" onclick="copyClass(this)">Small button</a>
            <a type="button" class="btn btn-secondary btn-sm" onclick="copyClass(this)">Small button</a>
        </p>

        <script>
            function copyClass(element) {
                const classValue = element.className;
                navigator.clipboard.writeText(classValue).then(() => {
                    alert('Class value copied: ' + classValue);
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                });
            }
        </script>
      format: 'full_html'

