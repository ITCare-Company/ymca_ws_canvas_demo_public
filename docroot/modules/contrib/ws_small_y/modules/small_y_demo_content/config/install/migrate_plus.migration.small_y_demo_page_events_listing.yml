langcode: en
status: true
dependencies:
  module:
    - small_y_demo_content
  enforced:
    module:
      - small_y_demo_content
id: small_y_demo_page_events_listing
migration_tags:
  - openy_small_y_installation
migration_group: small_y_demo_content
label: 'Import demo Layout Builder page - Events'
source:
  plugin: embedded_data
  data_rows:
    -
      id: 1
      title: 'Events'
      meta_description: "We can't serve our community without having some fun. Scroll on to see what events are happening near you."
      meta_image: events_page_image_1
      sections:
        1header:
          components:
            logo:
              block_config: true
              region: 'header_bottom_left'
              config:
                id: 'ws_site_logo'
                label: 'Site Logo Block'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
                logo_type: colorway
            website_name:
              block_config: true
              region: 'header_top_left'
              config:
                id: 'ws_site_name'
                label: 'Website Name Block'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
            menu:
              block_config: true
              region: 'header_bottom_middle'
              config:
                id: 'system_menu_block:main'
                label: 'Demo Main navigation'
                label_display: '0'
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            top_navigation:
              block_config: true
              region: 'header_bottom_right'
              config:
                id: 'system_menu_block:top-navigation'
                label: 'Demo Top Navigation menu'
                label_display: '0'
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            translate:
              block_config: true
              region: 'header_top_right'
              config:
                id: openy_gtranslate_block
                label: 'Open Y Google Translate'
                label_display: '0'
                provider: openy_gtranslate
                context_mapping: { }
            utility:
              block_config: true
              region: 'header_top_right'
              config:
                id: 'system_menu_block:utility'
                label: 'Utility menu'
                label_display: '0'
                provider: system
                context_mapping: { }
                level: 1
                depth: 1
                expand_all_items: false
            search:
              block_config: true
              region: 'header_top_right'
              config:
                id: ws_search_bar
                label: 'Search Bar Block'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
        1breadcrumbs:
          components:
            breadcrumbs:
              block_config: true
              region: 'blb_region_col_1'
              config:
                id: system_breadcrumb_block
                label: Breadcrumbs
                label_display: '0'
                provider: system
                context_mapping: { }
        2banner:
          components:
            lb_hero_sub_chevron_no_media:
              uuid: "35ae9030-6bce-4d54-bddc-abc48534b2eb"
              region: 'blb_region_col_1'
              config:
                id: "inline_block:lb_hero"
                label_display: "hidden"
                label: "Events"
                view_mode: "full"
                provider: "layout_builder"
              additional:
                bootstrap_styles:
                  block_style:
                    ws_style_option:
                      hero_banner: small_y_hero_sub_chevron_no_media
                      lb_hero_background: background_color
                      button_fill_component: ws_button_fill_component_filled
#        3body:
#          components:
#            lb_code_block:
#              uuid: "44e37de7-cafc-499d-a7fb-c1a4cb75daa7"
#              region: 'blb_region_col_1'
#              config:
#                id: "inline_block:lb_table"
#                label: "Something for Everyone"
#                label_display: 0
#                provider: "layout_builder"
#                view_mode: "full"
        4events:
          components:
            events_filter:
              uuid: '82468ff3-8ce8-42ef-9baf-74871b74b215'
              region: 'blb_region_col_1'
              config:
                id: "inline_block:events_filter"
                label: "Find Events Near You"
                label_display: 0
                provider: "layout_builder"
                view_mode: "full"
            featured_events:
              uuid: "57b6bdc9-a572-46cf-a4de-feb83876599e"
              region: 'blb_region_col_1'
              config:
                label: "Featured"
                id: "inline_block:featured_events"
                label_display: 'visible'
                provider: "layout_builder"
                view_mode: "full"
            events_listing:
              uuid: '92468ff3-8ce8-52ef-9baf-74871b74b315'
              region: 'blb_region_col_1'
              config:
                label: "All events"
                id: "inline_block:events_listing"
                label_display: 'visible'
                provider: "layout_builder"
                view_mode: "full"
        5footer:
          components:
            copyright:
              region: 'footer_bottom_left'
              uuid: '1d1d620e-a672-400f-81d6-4841d22d808b'
              config:
                id: 'block_content:1d1d620e-a672-400f-81d6-4841d22d808b'
                label: 'Small Y Footer Copyright Block'
                label_display: 0
                provider: block_content
                status: true
                info: ''
                view_mode: full
                context_mapping: { }
            site_logo:
              block_config: true
              region: 'footer_top_left'
              config:
                id: ws_site_logo
                label: 'Site Logo'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
                logo_type: white
            menu_1:
              block_config: true
              region: 'footer_top_middle'
              config:
                id: 'system_menu_block:small-y-footer-1'
                label: 'Helpful Links'
                label_display: 1
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            menu_2:
              block_config: true
              region: 'footer_top_middle'
              config:
                id: 'system_menu_block:small-y-footer-2'
                label: 'Get Involved'
                label_display: 1
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            stay_connected:
              block_config: true
              region: 'footer_bottom_right'
              config:
                id: 'block_content:c8a209e8-f6ed-4158-ac2f-de2a48c6dcea'
                label: 'Small Y Footer Social Block'
                label_display: 0
                provider: block_content
                status: true
                info: ''
                view_mode: full
                context_mapping: { }
            menu:
              block_config: true
              region: 'footer_bottom_left'
              config:
                id: 'system_menu_block:footer'
                label: Footer
                label_display: 0
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
  ids:
    id:
      type: integer
process:
  langcode:
    plugin: default_value
    source: language
    default_value: en
  title: title
  type:
    -
      plugin: default_value
      default_value: landing_page_lb
  status:
    -
      plugin: default_value
      default_value: 1
  uid:
    -
      plugin: default_value
      default_value: 1
  override_styles:
    - plugin: default_value
      default_value: 1
  styles/value:
    - plugin: default_value
      default_value: 'a:6:{s:8:"colorway";s:17:"ws_colorway_green";s:13:"border_radius";s:19:"ws_border_radius_10";s:19:"border_style_global";s:34:"ws_border_style_global_drop_shadow";s:21:"text_alignment_global";s:29:"ws_text_alignment_global_left";s:22:"button_position_global";s:32:"ws_button_position_global_inside";s:18:"button_fill_global";s:28:"ws_button_fill_global_filled";}'
  __layout_builder__layout: sections
  __layout_builder__layout_defaults:
    plugin: default_value
    default_value:
      1header:
        label: "Header"
        id: 'ws_header'
        wrapper_classes: ''
      1breadcrumbs:
        bs_col: "blb_col_1"
        label: "Breadcrumbs"
        container: "w-100"
        remove_gutters: "1"
      2banner:
        bs_col: "blb_col_1"
        label: "Banner"
        container: "w-100"
        remove_gutters: "1"
      3body:
        bs_col: "blb_col_1"
        label: "Body"
        container: "container"
        remove_gutters: "1"
        section_classes: 'mt-5'
      4events:
        bs_col: "blb_col_1"
        label: "Events"
        container: "container"
        remove_gutters: "0"
        section_classes: 'mt-5'
      5footer:
        label: "Footer"
        id: 'ws_footer'
        wrapper_classes: ''
  layout_builder__layout:
    -
      plugin: merge_recursive
      source:
        - '@__layout_builder__layout_defaults'
        - '@__layout_builder__layout'
    - plugin: lb_sections
  field_meta_image:
    - plugin: migration_lookup
      migration: small_y_demo_media_image
      source: meta_image
  field_meta_description: meta_description
destination:
  plugin: 'entity:node'
  default_bundle: landing_page_lb
migration_dependencies:
  required:
    - small_y_demo_block_banner_chevron
    - small_y_demo_block_table_block
    - small_y_demo_events
    - small_y_demo_block_featured_event
    - small_y_demo_block_events_filter
    - small_y_demo_block_events_listing
  optional: { }
