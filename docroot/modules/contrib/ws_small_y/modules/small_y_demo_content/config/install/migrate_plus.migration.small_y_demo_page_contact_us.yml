langcode: en
status: true
dependencies:
  module:
    - small_y_demo_content
  enforced:
    module:
      - small_y_demo_content
id: small_y_demo_page_contact_us
migration_tags:
  - openy_small_y_installation
migration_group: small_y_demo_content
label: 'Import demo Layout Builder page - Contact Us'
source:
  plugin: embedded_data
  data_rows:
    -
      id: 1
      title: 'Demo - Contact Us'
      meta_description: "We want to hear from you."
      meta_image: contactus_page_image_1
      sections:
        1header:
          components:
            logo:
              block_config: true
              region: 'header_bottom_left'
              config:
                id: 'ws_site_logo'
                label: 'Site Logo Block'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
                logo_type: colorway
            website_name:
              block_config: true
              region: 'header_top_left'
              config:
                id: 'ws_site_name'
                label: 'Website Name Block'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
            menu:
              block_config: true
              region: 'header_bottom_middle'
              config:
                id: 'system_menu_block:main'
                label: 'Demo Main navigation'
                label_display: '0'
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            top_navigation:
              block_config: true
              region: 'header_bottom_right'
              config:
                id: 'system_menu_block:top-navigation'
                label: 'Demo Top Navigation menu'
                label_display: '0'
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            translate:
              block_config: true
              region: 'header_top_right'
              config:
                id: openy_gtranslate_block
                label: 'Open Y Google Translate'
                label_display: '0'
                provider: openy_gtranslate
                context_mapping: { }
            utility:
              block_config: true
              region: 'header_top_right'
              config:
                id: 'system_menu_block:utility'
                label: 'Utility menu'
                label_display: '0'
                provider: system
                context_mapping: { }
                level: 1
                depth: 1
                expand_all_items: false
            search:
              block_config: true
              region: 'header_top_right'
              config:
                id: ws_search_bar
                label: 'Search Bar Block'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
        4form:
          components:
            lb_webform:
              uuid: "8b31f98c-f0dd-446d-85a2-214510a9a6e0"
              region: 'blb_region_col_1'
              config:
                id: "inline_block:lb_webform"
                label_display: "hidden"
                label: "Contact Us"
                view_mode: "full"
                provider: "layout_builder"
        6footer:
          components:
            copyright:
              region: 'footer_bottom_left'
              uuid: '1d1d620e-a672-400f-81d6-4841d22d808b'
              config:
                id: 'block_content:1d1d620e-a672-400f-81d6-4841d22d808b'
                label: 'Small Y Footer Copyright Block'
                label_display: 0
                provider: block_content
                status: true
                info: ''
                view_mode: full
                context_mapping: { }
            site_logo:
              block_config: true
              region: 'footer_top_left'
              config:
                id: ws_site_logo
                label: 'Site Logo'
                label_display: '0'
                provider: y_lb
                context_mapping: { }
                logo_type: white
            menu_1:
              block_config: true
              region: 'footer_top_middle'
              config:
                id: 'system_menu_block:small-y-footer-1'
                label: 'Helpful Links'
                label_display: 1
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            menu_2:
              block_config: true
              region: 'footer_top_middle'
              config:
                id: 'system_menu_block:small-y-footer-2'
                label: 'Get Involved'
                label_display: 1
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
            stay_connected:
              block_config: true
              region: 'footer_bottom_right'
              config:
                id: 'block_content:c8a209e8-f6ed-4158-ac2f-de2a48c6dcea'
                label: 'Small Y Footer Social Block'
                label_display: 0
                provider: block_content
                status: true
                info: ''
                view_mode: full
                context_mapping: { }
            menu:
              block_config: true
              region: 'footer_bottom_left'
              config:
                id: 'system_menu_block:footer'
                label: Footer
                label_display: 0
                provider: system
                context_mapping: { }
                level: 1
                depth: 0
                expand_all_items: false
  ids:
    id:
      type: integer
process:
  langcode:
    plugin: default_value
    source: language
    default_value: en
  title: title
  type:
    -
      plugin: default_value
      default_value: landing_page_lb
  status:
    -
      plugin: default_value
      default_value: 1
  uid:
    -
      plugin: default_value
      default_value: 1
  override_styles:
    - plugin: default_value
      default_value: 1
  styles/value:
    - plugin: default_value
      default_value: 'a:6:{s:8:"colorway";s:17:"ws_colorway_green";s:13:"border_radius";s:19:"ws_border_radius_10";s:19:"border_style_global";s:34:"ws_border_style_global_drop_shadow";s:21:"text_alignment_global";s:29:"ws_text_alignment_global_left";s:22:"button_position_global";s:32:"ws_button_position_global_inside";s:18:"button_fill_global";s:28:"ws_button_fill_global_filled";}'
  __layout_builder__layout: sections
  __layout_builder__layout_defaults:
    plugin: default_value
    default_value:
      1header:
        label: "Header"
        id: 'ws_header'
        wrapper_classes: ''
      2banner:
        bs_col: "blb_col_1"
        label: "Banner"
        container: "w-100"
        remove_gutters: "1"
      3body:
        bs_col: "blb_col_1"
        label: "Body"
        container: "container"
        remove_gutters: "1"
        section_classes: 'mt-5'
      4form:
        bs_col: "blb_col_1"
        label: "Form"
        container: "container"
        remove_gutters: "0"
        section_classes: 'mt-5'
      5second_banner:
        bs_col: "blb_col_1"
        label: "Banner"
        container: "w-100"
        remove_gutters: "1"
        section_classes: 'mt-5'
        container_wrapper_attributes:
          id: 'media-room'
      6footer:
        label: "Footer"
        id: 'ws_footer'
        wrapper_classes: ''
  layout_builder__layout:
    -
      plugin: merge_recursive
      source:
        - '@__layout_builder__layout_defaults'
        - '@__layout_builder__layout'
    - plugin: lb_sections
  field_meta_image:
    - plugin: migration_lookup
      migration: small_y_demo_media_image
      source: meta_image
  field_meta_description: meta_description
destination:
  plugin: 'entity:node'
  default_bundle: landing_page_lb
migration_dependencies:
  required:
    - small_y_demo_block_banner_chevron
    - small_y_demo_block_banner_standard
    - small_y_demo_block_table_block
    - small_y_demo_block_webform
  optional: { }
