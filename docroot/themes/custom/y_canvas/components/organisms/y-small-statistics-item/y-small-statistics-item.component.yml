'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Small Statistics Item
description: Individual compact statistic with value and label
status: experimental
group: Molecules

props:
  type: object
  properties:
    value:
      type: string
      title: Value
      description: The statistic number or value
      examples:
        - '10,000+'

    label:
      type: string
      title: Label
      description: Description of what the value represents
      examples:
        - 'Members Served'

    prefix:
      type: string
      title: Prefix
      description: Optional prefix before the value (e.g., $, #)
      examples:
        - '$'

libraryOverrides:
  dependencies:
    - y_canvas/y-small-statistics-item
