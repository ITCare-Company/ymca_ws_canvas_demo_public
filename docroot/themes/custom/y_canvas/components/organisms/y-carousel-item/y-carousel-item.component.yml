'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Carousel Item
description: Individual carousel slide with image, title, and CTA
status: experimental
group: Molecules

props:
  type: object
  properties:
    title:
      type: string
      title: Slide Heading
      description: Main heading for the slide
      examples:
        - 'Welcome to Your Y'

    description:
      type: string
      title: Description
      description: Supporting text (HTML allowed)
      contentMediaType: text/html
      examples:
        - '<p>Join our community and discover programs for everyone.</p>'

    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Slide Image
      description: Background image for the slide
      examples:
        - src: '/themes/custom/y_canvas/assets/images/demo/carousel-slide.jpg'
          alt: 'Slide background'
          width: 1440
          height: 600

    cta_text:
      type: string
      title: Button Text
      description: Call-to-action button label
      examples:
        - 'Learn More'

    cta_url:
      type: string
      title: Button URL
      description: Call-to-action button link
      examples:
        - '/membership'

    text_position:
      type: string
      title: Text Position
      description: Position of text content
      default: left
      enum:
        - left
        - center
        - right
      meta:enum:
        left: 'Left'
        center: 'Center'
        right: 'Right'
      examples:
        - left

    theme:
      type: string
      title: Color Theme
      description: Light or dark text overlay
      default: dark
      enum:
        - light
        - dark
      meta:enum:
        light: 'Light text'
        dark: 'Dark text'
      examples:
        - dark

libraryOverrides:
  dependencies:
    - y_canvas/y-carousel-item
