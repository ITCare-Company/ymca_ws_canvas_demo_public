'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Articles Filter
description: Filter controls for articles listing with category and search options
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Main heading for the filter section
      examples:
        - 'Filter Articles'

    show_search:
      type: boolean
      title: Show Search
      description: Display the search input field
      default: true
      examples:
        - true

    show_categories:
      type: boolean
      title: Show Categories
      description: Display category filter dropdown
      default: true
      examples:
        - true

    search_placeholder:
      type: string
      title: Search Placeholder
      description: Placeholder text for search input
      examples:
        - 'Search articles...'

    categories:
      type: array
      title: Categories
      description: Available category options for filtering
      examples:
        - ['News', 'Events', 'Health & Wellness', 'Community']

    action_url:
      type: string
      title: Form Action URL
      description: URL where filter form submits
      examples:
        - '/articles'

libraryOverrides:
  dependencies:
    - y_canvas/y-articles-filter
