'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Testimonials
description: Testimonials carousel with member quotes
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Section heading
      examples:
        - 'What Our Members Say'

    subtitle:
      type: string
      title: Subtitle
      description: Section subheading
      examples:
        - 'Real stories from real members'

    autoplay:
      type: boolean
      title: Autoplay
      description: Automatically rotate testimonials
      default: true
      examples:
        - true

    show_controls:
      type: boolean
      title: Show Controls
      description: Show navigation arrows and indicators
      default: true
      examples:
        - true

    heading_level:
      type: string
      title: Heading Level
      description: Semantic heading level
      default: h2
      enum:
        - h2
        - h3
        - h4
      meta:enum:
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
      examples:
        - h2

slots:
  items:
    title: Testimonial Items
    description: Testimonial item components
    allowedComponents:
      - sdc.y_canvas.y-testimonial-item

libraryOverrides:
  dependencies:
    - y_canvas/y-testimonials
