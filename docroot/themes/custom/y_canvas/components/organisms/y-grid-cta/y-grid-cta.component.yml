'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Grid CTA
description: Grid layout with call-to-action cards
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Section heading
      examples:
        - 'Our Programs'

    subtitle:
      type: string
      title: Subtitle
      description: Section subheading
      examples:
        - 'Discover what we offer'

    cta_text:
      type: string
      title: Section Button Text
      description: Section-level call-to-action button
      examples:
        - 'View All Programs'

    cta_url:
      type: string
      title: Section Button URL
      description: Section-level call-to-action link
      examples:
        - '/programs'

    columns:
      type: string
      title: Columns
      description: Number of columns in the grid
      default: '3'
      enum:
        - '2'
        - '3'
        - '4'
      meta:enum:
        '2': '2 Columns'
        '3': '3 Columns'
        '4': '4 Columns'
      examples:
        - '3'

    heading_level:
      type: string
      title: Heading Level
      description: Semantic heading level
      default: h2
      enum:
        - h2
        - h3
        - h4
      meta:enum:
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
      examples:
        - h2

slots:
  items:
    title: Grid Items
    description: Grid item components
    allowedComponents:
      - sdc.y_canvas.y-grid-item

libraryOverrides:
  dependencies:
    - y_canvas/y-grid-cta
