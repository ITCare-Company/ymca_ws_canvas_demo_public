'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Ping Pong Section
description: Container for alternating ping-pong content blocks
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Section Title
      description: Main heading for the ping-pong section
      examples:
        - 'Our Programs'

    subtitle:
      type: string
      title: Section Subtitle
      description: Supporting text below the heading
      examples:
        - 'Discover what we offer for every member of your family'

slots:
  items:
    title: Ping Pong Items
    description: Alternating image/text content blocks

libraryOverrides:
  dependencies:
    - y_canvas/y-ping-pong-section
