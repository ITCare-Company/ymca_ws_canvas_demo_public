'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Promo
description: Promotional card with image, title, description, and call-to-action
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Card heading
      examples:
        - 'Join Today'

    description:
      type: string
      title: Description
      description: Card body content (HTML allowed)
      contentMediaType: text/html
      examples:
        - '<p>Become a member and enjoy all our facilities.</p>'

    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Image
      description: Promotional image
      examples:
        - src: '/themes/custom/y_canvas/assets/images/demo/promo.jpg'
          alt: 'Promo image'
          width: 400
          height: 300

    cta_text:
      type: string
      title: Button Text
      description: Call-to-action button label
      examples:
        - 'Learn More'

    cta_url:
      type: string
      title: Button URL
      description: Call-to-action button link
      examples:
        - '/membership'

    image_style:
      type: string
      title: Image Style
      description: How the image is displayed
      default: standard
      enum:
        - standard
        - rounded
        - circle
      meta:enum:
        standard: 'Standard'
        rounded: 'Rounded corners'
        circle: 'Circle (for icons/avatars)'
      examples:
        - standard

    background:
      type: string
      title: Background Color
      description: Card background color
      default: white
      enum:
        - white
        - gray
        - primary
      meta:enum:
        white: 'White'
        gray: 'Light Gray'
        primary: 'Primary Color'
      examples:
        - white

    heading_level:
      type: string
      title: Heading Level
      description: Semantic heading level
      default: h3
      enum:
        - h2
        - h3
        - h4
      meta:enum:
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
      examples:
        - h3

libraryOverrides:
  dependencies:
    - y_canvas/y-promo
