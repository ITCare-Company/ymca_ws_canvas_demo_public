'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Code Block
description: Custom code/script embed block for third-party integrations
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Optional heading above the embedded content
      examples:
        - 'Video Player'

    code:
      type: string
      title: Code Content
      description: HTML, JavaScript, or embed code to render
      contentMediaType: text/html
      examples:
        - '<iframe src="https://www.youtube.com/embed/..." frameborder="0"></iframe>'

    language:
      type: string
      title: Language
      description: Type of code being embedded
      default: 'html'
      enum:
        - 'html'
        - 'javascript'
        - 'css'
        - 'embed'
      meta:enum:
        html: 'HTML'
        javascript: 'JavaScript'
        css: 'CSS'
        embed: 'Embed Code'
      examples:
        - 'embed'

libraryOverrides:
  dependencies:
    - y_canvas/y-code-block
