'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Tabs
description: Tabbed content container with multiple panels
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Section heading
      examples:
        - 'Membership Options'

    subtitle:
      type: string
      title: Subtitle
      description: Section subheading
      examples:
        - 'Choose the plan that fits your needs'

    tabs_id:
      type: string
      title: Tabs ID
      description: Unique identifier for the tabs
      examples:
        - 'membership-tabs'

    heading_level:
      type: string
      title: Heading Level
      description: Semantic heading level
      default: h2
      enum:
        - h2
        - h3
        - h4
      meta:enum:
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
      examples:
        - h2

slots:
  items:
    title: Tab Items
    description: Tab item components
    allowedComponents:
      - sdc.y_canvas.y-tab-item

libraryOverrides:
  dependencies:
    - y_canvas/y-tabs
