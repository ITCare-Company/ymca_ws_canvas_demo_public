'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Featured Highlights
description: Featured content highlights with image and text
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Main heading for the highlights section
      examples:
        - 'Why Choose the Y'

    subtitle:
      type: string
      title: Subtitle
      description: Supporting text below the main heading
      examples:
        - 'Discover what makes us different'

    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Featured Image
      description: Main image for the highlights section
      examples:
        - src: '/themes/custom/y_canvas/assets/images/demo/ping-pong.jpg'
          alt: 'YMCA community members'

    description:
      type: string
      title: Description
      description: Main content text (HTML allowed)
      contentMediaType: text/html
      examples:
        - '<p>At the Y, we believe in nurturing potential and creating community.</p>'

    cta_text:
      type: string
      title: CTA Button Text
      description: Call-to-action button label
      examples:
        - 'Learn More'

    cta_url:
      type: string
      title: CTA Button URL
      description: Call-to-action button link
      examples:
        - '/about'

    layout:
      type: string
      title: Layout
      description: Image and content layout arrangement
      default: 'image-left'
      enum:
        - 'image-left'
        - 'image-right'
        - 'image-top'
      meta:enum:
        image-left: 'Image Left'
        image-right: 'Image Right'
        image-top: 'Image Top'
      examples:
        - 'image-left'

slots:
  highlights:
    title: Highlight Items
    description: Individual highlight items with icons

libraryOverrides:
  dependencies:
    - y_canvas/y-featured-highlights
