'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Carousel
description: YMCA carousel/slider component for hero banners and content
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Section Heading
      description: Optional heading above the carousel
      examples:
        - 'Featured Programs'

    subtitle:
      type: string
      title: Section Subheading
      description: Optional subheading text
      examples:
        - 'Discover what we have to offer'

    autoplay:
      type: boolean
      title: Autoplay
      description: Automatically advance slides
      default: true
      examples:
        - true

    autoplay_delay:
      type: integer
      title: Autoplay Delay (ms)
      description: Time between slide transitions
      default: 5000
      examples:
        - 5000

    show_navigation:
      type: boolean
      title: Show Navigation Arrows
      description: Display previous/next buttons
      default: true
      examples:
        - true

    show_pagination:
      type: boolean
      title: Show Pagination Dots
      description: Display slide indicator dots
      default: true
      examples:
        - true

    loop:
      type: boolean
      title: Loop
      description: Enable infinite loop
      default: true
      examples:
        - true

    effect:
      type: string
      title: Transition Effect
      description: Slide transition animation
      default: slide
      enum:
        - slide
        - fade
      meta:enum:
        slide: 'Slide'
        fade: 'Fade'
      examples:
        - slide

slots:
  slides:
    title: Carousel Slides
    description: Add carousel items to this section
    allowedComponents:
      - sdc.y_canvas.y-carousel-item

libraryOverrides:
  dependencies:
    - y_canvas/y-carousel
