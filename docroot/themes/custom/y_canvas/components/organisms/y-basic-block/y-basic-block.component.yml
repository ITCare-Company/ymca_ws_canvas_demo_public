'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Basic Block
description: Simple content block with title and body text
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Block heading text
      examples:
        - 'About Our Programs'

    body:
      type: string
      title: Body Content
      description: Main content area (HTML allowed)
      contentMediaType: text/html
      examples:
        - '<p>Learn more about our community programs and services.</p>'

libraryOverrides:
  dependencies:
    - y_canvas/y-basic-block
